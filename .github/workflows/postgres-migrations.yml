name: Disposable PostgreSQL migrations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: migration_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ai_delivery_platform_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_test -d ai_delivery_platform_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://migration_test@127.0.0.1:5432/ai_delivery_platform_migrations
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Verify migrations and retain redacted output
        run: python tests/postgres_migration_check.py 2>&1 | tee ../postgres-migration-output.txt
        working-directory: backend
      - name: Upload PostgreSQL verification output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: postgres-migration-verification
          path: postgres-migration-output.txt
          retention-days: 14
          if-no-files-found: error
